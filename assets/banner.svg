<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g>
    <circle cx="150" cy="90" r="130" fill="#38bdf8" opacity="0.18" filter="url(#orbGlow)">
      <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;140;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="330" r="160" fill="#c084fc" opacity="0.15" filter="url(#orbGlow)">
      <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="330;270;330" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="100" r="120" fill="#818cf8" opacity="0.16" filter="url(#orbGlow)">
      <animate attributeName="cy" values="100;160;100" dur="11s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Graph & Nodes in Background / Flanks -->
  <g opacity="0.45">
    <!-- Connecting animated circuit / pulse lines -->
    <path d="M 50 340 Q 200 280 350 330 T 650 310 T 950 350 T 1150 290" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="15s" repeatCount="indefinite" />
    </path>
    <path d="M 50 370 Q 250 320 500 360 T 900 320 T 1150 360" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="18s" repeatCount="indefinite" />
    </path>

    <!-- Floating Metric Pill 1 (Left) -->
    <g transform="translate(60, 60)">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#10b981">
        <animate attributeName="r" values="6;8.5;6" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="42" y="26" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">360° Review Cycles</text>
      <animateTransform attributeName="transform" type="translate" values="60,60; 60,50; 60,60" dur="5s" repeatCount="indefinite" />
    </g>

    <!-- Floating Metric Pill 2 (Right) -->
    <g transform="translate(950, 70)">
      <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="24" cy="21" r="7" fill="#6366f1">
        <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="42" y="26" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">OKR &amp; Goal Alignment</text>
      <animateTransform attributeName="transform" type="translate" values="950,70; 950,82; 950,70" dur="6s" repeatCount="indefinite" />
    </g>

    <!-- Floating Metric Pill 3 (Bottom Left) -->
    <g transform="translate(80, 290)">
      <rect width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Continuous Feedback</text>
      <animateTransform attributeName="transform" type="translate" values="80,290; 80,300; 80,290" dur="4.5s" repeatCount="indefinite" />
    </g>

    <!-- Floating Metric Pill 4 (Bottom Right) -->
    <g transform="translate(960, 280)">
      <rect width="165" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Open-Source HRMS</text>
      <animateTransform attributeName="transform" type="translate" values="960,280; 960,270; 960,280" dur="5.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) - Clear and Unhidden -->
  <g text-anchor="middle">
    <!-- Top Pill Header -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      Employee Performance Management
    </text>

    <!-- Gradient Highlight Accent Subtitle -->
    <text x="600" y="215" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.3">
      &amp; Appraisals Ecosystem
    </text>

    <!-- Tagline Description -->
    <text x="600" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Comprehensive guide to top SaaS platforms, open-source alternatives, 360° reviews, and OKR engines
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(600, 315)">
      <!-- Tag 1 -->
      <rect x="-260" y="-14" width="105" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-207" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🏆 Top SaaS</text>

      <!-- Tag 2 -->
      <rect x="-140" y="-14" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="-75" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🔓 Open Source</text>

      <!-- Tag 3 -->
      <rect x="5" y="-14" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="67" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🎯 OKR Alignment</text>

      <!-- Tag 4 -->
      <rect x="145" y="-14" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="207" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🔄 360° Feedback</text>
    </g>
  </g>
</svg>
